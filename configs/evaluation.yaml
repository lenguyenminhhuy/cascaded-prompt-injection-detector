fpr_targets: [0.001, 0.005, 0.01, 0.05]

threshold_sweep:
  theta_safe_range: [0.50, 0.95]
  theta_unsafe_range: [0.05, 0.50]
  step: 0.01

metrics:
  - detection_rate_at_fpr
  - f1
  - escalation_rate
  - residual_fn_rate
  - ece

# Channels for per-channel reporting (SCHEMA.md §3).
channels:
  - direct
  - document_embedded
  - tool_output

# Splits used for final reporting.
report_splits:
  - test_in_dist          # in-distribution detection at deployment base rate
  - test_cross_channel    # cross-channel generalization
  - test_cross_domain     # cross-domain transfer (never trained)
