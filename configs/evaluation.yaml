fpr_targets: [0.001, 0.005, 0.01, 0.05]

threshold_sweep:
  theta_safe_range: [0.50, 0.95]
  theta_unsafe_range: [0.05, 0.50]
  step: 0.01

metrics:
  - detection_rate_at_fpr
  - f1
  - escalation_rate
  - residual_fn_rate
  - ece

channels:
  - document_embedded
  - tool_output
  - direct
  - app_structured
  - conversational
