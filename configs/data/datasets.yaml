# cascade-pid v1 source registry (SCHEMA.md contract).
#
# Core domain is Text-to-SQL / data-assistant. Every positive is mapped to a
# (channel, payload_family) and rendered channel-faithfully in Chunk 3.
# Licenses verified in Chunk 2 (see data/raw/LICENSES.md) — all MIT / permissive.
#
# channel:        direct | document_embedded | tool_output
# payload_family: instruction_override | exfiltration | tool_misuse |
#                 system_prompt_extraction | rbac_bypass

sources:
  agentdojo:
    kind: github
    license: MIT
    local: data/raw/agentdojo
    primary_channel: tool_output
    families: [tool_misuse, exfiltration, instruction_override]
    notes: >
      Injection tasks + injection vectors across workspace/banking/travel/slack
      suites. Payloads arrive in tool returns the agent itself called.

  injecagent:
    kind: github
    license: MIT
    local: ../datasets/InjecAgent/data
    primary_channel: tool_output
    families: [tool_misuse, exfiltration]
    notes: >
      Direct-Harm (dh) -> tool_misuse, Data-Stealing (ds) -> exfiltration.
      Payload lives in the 'Attacker Instruction' embedded in tool output.

  bipia:
    kind: github
    license: MIT
    local: data/raw/BIPIA
    primary_channel: document_embedded
    families: [instruction_override, exfiltration, tool_misuse]
    notes: >
      Attack strings injected into email/table/qa/code/web contexts. Text-attack
      categories map to instruction_override/exfiltration; code-attack categories
      map to tool_misuse.

  hackaprompt:
    kind: huggingface
    hf_id: hackaprompt/hackaprompt-dataset
    license: MIT
    primary_channel: direct
    families: [instruction_override, system_prompt_extraction]
    notes: "Direct user-turn injections. Dedup + success-only filter."

  tensortrust:
    kind: huggingface
    hf_id: qxcv/tensor-trust
    license: MIT
    primary_channel: direct
    families: [system_prompt_extraction, instruction_override]
    notes: "Prompt-extraction & hijacking attacks from the TensorTrust game."

  synthetic:
    kind: generator
    license: authored
    primary_channel: any
    families: [rbac_bypass, instruction_override, exfiltration, tool_misuse, system_prompt_extraction]
    notes: >
      Fills thin (channel x family) cells, esp. rbac_bypass (SQL-specific) and
      ambiguous calibration material. Deterministic, seeded templates.

  authored:
    kind: generator
    license: authored
    primary_channel: any
    families: []
    notes: >
      Hand-curated hard benign negatives (adversarial-looking-but-benign) and
      the cross-domain (browsing/calendar/email) held-out test slice.

# Benign negative sources are generated channel-matched in Chunk 4; we do not
# pull external benign corpora for v1 to keep the SQL domain controlled.
